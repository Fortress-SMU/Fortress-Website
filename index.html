<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역천: The Sky Breaker</title>
    <!-- 폰트 로드: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- 프로필 섹션 -->
        <header class="profile">
            <div class="avatar" id="avatar" role="img" aria-label="프로필 이미지">
                <span>🎮</span>
            </div>
            <h1>임시 페이지</h1>
        </header>

        <!-- 링크 버튼들 -->
        <main class="links">
            <a href="https://forms.gle/y2vbAe7tYzk2wFY68" class="link-btn" rel="noopener noreferrer" target="_blank">
                <span class="icon">📬</span>
                <span class="text">임시 페이지</span>
            </a>
            <a href="https://instagram.com" class="link-btn" rel="noopener noreferrer" target="_blank">
                <span class="icon">🏠</span>
                <span class="text">"임시 페이지</span>
            </a>
            <a href="https://game.smu.ac.kr/game01" class="link-btn">
                <span class="icon">🕹️</span>
                <span class="text">상명대학교 게임전공</span>
            </a>
        </main>

        <!-- 하단 정보 -->
        <footer>
            <p>포트리스 - "역천" 개발팀</p>
        </footer>
    </div>

    <script>
        // 간단한 햅틱 피드백 등 동적 상호작용 추가 가능
        document.querySelectorAll('.link-btn').forEach(button => {
            button.addEventListener('pointerdown', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('pointerup', () => {
                button.style.transform = '';
            });
            button.addEventListener('pointerleave', () => {
                button.style.transform = '';
            });
        });
    </script>
</body>

</html>
